name: Publish Evere Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evere-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/build-share-cards.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
