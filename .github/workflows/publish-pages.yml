name: Publish Evere Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evere-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      actions: read
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock linkedom@0.18.12
      - name: Check for changed share cards
        id: cards
        if: github.event_name == 'schedule'
        run: |
          changed=$(node scripts/build-share-cards.mjs . --check)
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - uses: actions/jekyll-build-pages@v1
        if: github.event_name != 'schedule' || steps.cards.outputs.changed == 'true'
        with:
          source: ./
          destination: ./_site
      - name: Restore published thumbnails
        if: github.event_name != 'schedule' || steps.cards.outputs.changed == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/evere-share-thumbnails
          key: evere-share-thumbnails-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: evere-share-thumbnails-v1-
      - name: Generate share metadata
        if: github.event_name != 'schedule' || steps.cards.outputs.changed == 'true'
        env:
          EVERE_THUMBNAIL_CACHE: ${{ runner.temp }}/evere-share-thumbnails
        run: |
          sudo chown -R "$(id -u):$(id -g)" _site
          node scripts/build-share-cards.mjs _site
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'schedule' || steps.cards.outputs.changed == 'true'
        with:
          path: _site

      - name: Wait for the Pages artifact
        if: github.event_name != 'schedule' || steps.cards.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..8}; do
            if [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '.artifacts | any(.name == "github-pages" and .expired == false)' || true)" = true ]; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::The Pages artifact is not visible yet."
          exit 1

      - name: Deploy Pages
        if: github.event_name != 'schedule' || steps.cards.outputs.changed == 'true'
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Retry Pages deployment
        if: steps.deployment.outcome == 'failure'
        id: deploy_retry
        uses: actions/deploy-pages@v4
      - name: Save published thumbnails
        if: github.event_name != 'schedule' || steps.cards.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/evere-share-thumbnails
          key: evere-share-thumbnails-v1-${{ github.run_id }}-${{ github.run_attempt }}
