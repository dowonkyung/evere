name: Publish Evere Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evere-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock linkedom@0.18.12
      - name: Check for changed share cards
        id: cards
        if: github.event_name == 'schedule'
        run: |
          changed=$(node scripts/build-share-cards.mjs . --check)
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - uses: actions/jekyll-build-pages@v1
        if: github.event_name != 'schedule' || steps.cards.outputs.changed == 'true'
        with:
          source: ./
          destination: ./_site
      - name: Generate share metadata
        if: github.event_name != 'schedule' || steps.cards.outputs.changed == 'true'
        run: |
          sudo chown -R "$(id -u):$(id -g)" _site
          node scripts/build-share-cards.mjs _site
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'schedule' || steps.cards.outputs.changed == 'true'
        with:
          path: _site

      - name: Deploy Pages
        if: github.event_name != 'schedule' || steps.cards.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
