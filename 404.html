<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이브레</title>
  <style>[data-route-status]:empty + a { display: none; }</style>
</head>
<body>
  <p data-route-status role="status"></p>
  <a href="/">이브레 홈</a>
  <noscript>이 페이지를 보려면 JavaScript를 켜 주세요. <a href="/">이브레 홈</a></noscript>
  <script>
    const match = /^\/article\/([1-9]\d*)\/?$/.exec(location.pathname);
    const series = /^\/series\/articles\/([1-9]\d*)\/?$/.exec(location.pathname);
    const reporter = /^\/reporter\/([1-9]\d*)\/?$/.exec(location.pathname);
    const epaper = /^\/epaper\/([1-9]\d*)(?:\/([1-9]\d*))?\/?$/.exec(location.pathname);
    const route = match || series || reporter || epaper;
    if (route && Number.isSafeInteger(Number(route[1]))) {
      const target = new URL(epaper ? '/epaper/' : reporter ? '/reporter/' : series ? '/series/articles/' : '/article/', location.origin);
      target.search = location.search;
      target.searchParams.set(epaper ? 'issue' : 'number', route[1]);
      if (epaper?.[2]) target.searchParams.set('page', epaper[2]);
      if (series) target.searchParams.set('rev', 'series-title-2');
      target.hash = location.hash;
      location.replace(target);
    } else {
      document.querySelector('[data-route-status]').textContent = '페이지를 찾을 수 없습니다.';
    }
  </script>
</body>
</html>
