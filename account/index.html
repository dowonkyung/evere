<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#00B8B4">
  <title>회원 계정 | 이브레</title>
  <link rel="icon" href="/assets/evere/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
  <link rel="stylesheet" href="/assets/evere/account.css?v=centered-ellipsis-1">
  <script type="module" src="/assets/evere/account.js?v=member-admin-1"></script>
<script type="module" src="/assets/evere/route-init.js?v=routes-1"></script>
</head>
<body>
  <header class="account-header">
    <a href="/" aria-label="이브레 홈"><img src="/assets/evere/wordmark.svg" alt="이브레" width="110"></a>
    <nav class="account-links" aria-label="회원 메뉴"><a href="/newsroom/">이브레 뉴스룸</a>
    <button id="sign-out" type="button" hidden>로그아웃</button></nav>
  </header>
  <main>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="access" hidden>
      <h1 id="access-title">로그인</h1>
      <form id="access-form">
        <label id="signup-name" hidden>이름<input name="displayName" maxlength="40" autocomplete="name"></label>
        <label>이메일<input name="email" type="email" autocomplete="email" required></label>
        <label>비밀번호<input name="password" type="password" autocomplete="current-password" required></label>
        <button id="access-submit" type="submit">로그인</button>
      </form>
      <button id="switch-mode" class="text-action" type="button">회원가입</button>
      <button id="resend" class="text-action" type="button" hidden>인증 이메일 다시 보내기</button>
    </section>
    <section id="profile-setup" hidden>
      <h1>이브레 회원 이름 등록</h1>
      <form id="profile-form">
        <label>이름<input name="displayName" maxlength="40" autocomplete="name" required></label>
        <button type="submit">등록</button>
      </form>
    </section>
    <section id="workspace" hidden>
      <h1>회원 계정</h1>
      <p id="member-summary"></p>
      <p><a href="/newsroom/">이브레 뉴스룸 열기</a></p>
      <details id="profile-settings">
        <summary>내 프로필</summary>
        <div class="profile-settings">
          <form id="avatar-form">
            <img id="profile-avatar" class="profile-avatar" width="88" height="88" alt="내 프로필 사진" hidden>
            <label>프로필 사진<input name="avatar" type="file" accept="image/jpeg,image/png,image/webp" required></label>
            <p class="profile-note">JPG, PNG, WebP · 3MB 이하</p>
            <div class="article-action">
              <button type="submit">사진 저장</button>
              <button id="remove-avatar" type="button" hidden>사진 삭제</button>
            </div>
          </form>
          <form id="profile-details-form">
            <label>직책<input name="position" maxlength="60"></label>
            <p class="profile-note">프로필에 사용할 직책입니다. 편집실 등급과는 별개입니다.</p>
            <label>소개 멘트<textarea name="bio" rows="4" maxlength="500"></textarea></label>
            <button type="submit">프로필 저장</button>
          </form>
        </div>
      </details>

    </section>
    <noscript>회원 기능을 이용하려면 JavaScript를 켜 주세요.</noscript>
  </main>
</body>
</html>
