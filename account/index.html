    <h1 class="opinion-title">마이페이지</h1>

      <h1 id="access-title">로그인</h1>
      <form id="access-form">
        <label id="signup-name" hidden>이름<input name="displayName" maxlength="40" autocomplete="name"></label>
        <label>이메일<input name="email" type="email" autocomplete="email" required></label>
        <label>비밀번호<input name="password" type="password" autocomplete="current-password" required></label>
        <button id="access-submit" type="submit">로그인</button>
      </form>
      <button id="switch-mode" class="text-action" type="button">회원가입</button>
      <button id="resend" class="text-action" type="button" hidden>인증 이메일 다시 보내기</button>
    </section>
    <section id="profile-setup" hidden>
      <h1>이브레 회원 이름 등록</h1>
      <form id="profile-form">
        <label>이름<input name="displayName" maxlength="40" autocomplete="name" required></label>
        <button type="submit">등록</button>
      </form>
    </section>
    <section id="workspace" hidden>
      <nav class="child-section swiper-container" aria-label="마이페이지 메뉴">
        <ul class="swiper-wrapper">
          <li class="swiper-slide"><a href="#profile" data-my-tab="profile">기본정보</a></li>
          <li class="swiper-slide"><a href="#bookmarks" data-my-tab="bookmarks">북마크</a></li>
          <li class="swiper-slide"><a href="#subscriptions" data-my-tab="subscriptions">구독함</a></li>
        </ul>
      </nav>
      <section data-my-panel="profile" aria-label="기본정보">
        <div class="account-greeting">
          <p id="member-summary"></p>
          <div class="account-links"><a id="account-newsroom-link" href="/newsroom/" hidden>이브레 뉴스룸</a><button id="sign-out" type="button" hidden>로그아웃</button></div>
        </div>
        <div class="profile-settings" id="profile-settings">
          <form id="avatar-form">
            <img id="profile-avatar" class="profile-avatar" width="88" height="88" alt="내 프로필 사진" hidden>
            <label>프로필 사진<input name="avatar" type="file" accept="image/jpeg,image/png,image/webp" required></label>
            <p class="profile-note">JPG, PNG, WebP · 3MB 이하</p>
            <div class="article-action">
              <button type="submit">사진 저장</button>
              <button id="remove-avatar" type="button" hidden>사진 삭제</button>
            </div>
          </form>
          <form id="profile-details-form">
            <label>이름<input name="displayName" required maxlength="40" autocomplete="name"></label>
            <label>직책<input name="position" maxlength="60"></label>
            <p class="profile-note">프로필에 사용할 직책입니다. 편집실 등급과는 별개입니다.</p>
            <label>소개 멘트<textarea name="bio" rows="4" maxlength="500"></textarea></label>
            <label>기자 이메일 (선택)<input type="email" name="reporterEmail" maxlength="254" placeholder="name@example.com"></label>
            <p class="profile-note">입력하면 기사 기자 카드에 공개됩니다.</p>
            <button type="submit">프로필 저장</button>
          </form>
        </div>
      </section>
      <section data-my-panel="bookmarks" hidden><h2>북마크한 기사</h2><ul data-my-list="bookmarks"></ul></section>

    </section>
