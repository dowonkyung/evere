                <svg viewBox="0 0 20 20" width="18" height="18" fill="currentColor" aria-hidden="true"><path data-listen-play d="M6 3.7a.8.8 0 0 1 1.2-.7l10 6.3a.8.8 0 0 1 0 1.4l-10 6.3a.8.8 0 0 1-1.2-.7z"/><path data-listen-pause d="M5 4h3v12H5zm7 0h3v12h-3z" hidden/></svg>
              </button>
              <audio preload="metadata"></audio>
              <span data-listen-error role="status" hidden></span>
            </div>
          </div>
        </header>
        <div class="editor-subtitle" id="editor-subtitle" hidden><p id="subtitle"></p></div>
        <div id="article-photos" class="article-photos"></div>
        <div id="body" class="article-body"></div>
        <section id="reporter-profiles" class="reporter-profiles" aria-label="기사 작성 기자" hidden>
          <ul id="profile-card-list" class="profile_card_list" tabindex="0" aria-label="기자 프로필 목록"></ul>
          <button type="button" class="profile-arrow profile-previous" aria-label="이전 기자" aria-controls="profile-card-list" hidden><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="m6.657 10.851-.008.008 7.231 7.231 1.132-1.13-6.108-6.109 6.108-6.108-1.132-1.131-7.231 7.231.008.008Z" fill="#1D1D1D"/></svg></button>
          <button type="button" class="profile-arrow profile-next" aria-label="다음 기자" aria-controls="profile-card-list" hidden><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="m6.657 10.851-.008.008 7.231 7.231 1.132-1.13-6.108-6.109 6.108-6.108-1.132-1.131-7.231 7.231.008.008Z" fill="#1D1D1D"/></svg></button>
        </section>
      </article>
      <aside id="article-related" class="reader-related" aria-labelledby="article-related-title" hidden>
        <h2 id="article-related-title">주요기사</h2>
        <ul></ul>
      </aside>
      <section id="comments-section" class="reader-comments" aria-labelledby="comments-title" hidden>
        <div class="comment-section-heading">
          <h2 id="comments-title">댓글</h2>
          <button id="comments-refresh" type="button" aria-label="댓글 새로고침">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4v6h-6M20 10a8 8 0 1 0 .25 4"/></svg>
          </button>
        </div>
        <form id="comment-form" hidden>
          <div class="comment-composer-heading">
            <strong id="comment-writer"></strong>
          </div>
          <div class="comment-composer">
            <textarea id="comment-text" name="comment" aria-label="댓글" rows="2" maxlength="500" placeholder="댓글을 남겨주세요. 상대방을 불쾌하게 하는 댓글이나 욕설, 비방 등 글은 삼가해주세요. 관련 규정 미준수 시 제재될 수 있어요." required></textarea>
            <div class="comment-composer-actions">
              <span><output id="comment-length" for="comment-text" aria-label="입력한 글자 수">0</output><span aria-hidden="true">/500</span></span>
              <button type="submit" disabled>등록</button>
            </div>
          </div>
        </form>
        <p id="comment-sign-in"><a href="/account/">이브레 계정으로 로그인하고 댓글을 남겨 주세요.</a></p>
        <div class="comment-list-toolbar">
          <details id="comment-order" class="comment-order">
            <summary><span class="comment-order-label">최신순</span></summary>
            <ul aria-label="댓글 정렬">
              <li><button type="button" data-comment-order="latest" aria-pressed="true">최신순</button></li>
              <li><button type="button" data-comment-order="oldest" aria-pressed="false">오래된순</button></li>
            </ul>
          </details>
          <p id="comment-list-status" role="status"></p>
        </div>
        <ul id="comments" class="comment-list"></ul>
        <button id="comments-more" type="button" aria-controls="comments" hidden><span id="comments-remaining"></span>개의 댓글 더보기</button>
      </section>
    </div>
  </main>
{% include evere-footer.html %}
</body>
</html>
