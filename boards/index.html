<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>게시판 | 이브레</title>
  <link rel="icon" href="/assets/evere/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-jp-dynamic-subset.min.css">
  <link rel="stylesheet" href="/assets/evere/account.css?v=pretendard-jp-1">
  <script type="module" src="/assets/evere/boards.js?v=routes-1"></script>
<script type="module" src="/assets/evere/route-init.js?v=routes-1"></script>
</head>
<body>
  <header class="account-header">
    <a href="/" aria-label="이브레 홈"><img src="/assets/evere/wordmark.svg" alt="이브레" width="110"></a>
    <a href="/newsroom/">이브레 뉴스룸</a>
  </header>
  <main>
    <h1>게시판</h1>
    <p id="status" role="status"></p>
    <nav id="boards" aria-label="게시판 목록"></nav>
    <section id="posts" class="article-section" hidden>
      <h2 id="board-name"></h2>
      <p id="board-description"></p>
      <div id="post-list"></div>
      <div class="pager">
        <button id="prev" type="button" disabled>이전</button>
        <button id="next" type="button" disabled>다음</button>
      </div>
    </section>
  </main>
</body>
</html>
