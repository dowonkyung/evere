<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><style>
body { color: var(--uxp-host-text-color, #f4f6fa); padding: 10px; font-size: 12px; }
[hidden] { display: none; }
.press-brand { margin: 0 0 12px; }
.press-brand img { display: block; width: 100%; max-width: 236px; height: auto; }
#login, #workspace { display: flex; flex-direction: column; }
#login[hidden], #workspace[hidden] { display: none; }
label, .press-label { color: inherit; }
.press-label { font-size: 15px; font-weight: 700; margin: 0 0 5px; }

input, select { margin-bottom: 7px; color: inherit; }
#issue { box-sizing: border-box; align-self: stretch; width: 100%; margin: 0 0 10px; }
button { box-sizing: border-box; color: inherit; font-size: 11px; white-space: nowrap; border: 1px solid var(--uxp-host-border-color, #aaa); border-radius: 2px; }
.press-scroll { max-height: 310px; overflow-x: auto; overflow-y: auto; }
.press-table { width: 100%; min-width: 235px; }
.press-row { display: flex; align-items: center; width: 100%; min-height: 29px; border-bottom: 1px solid var(--uxp-host-border-color, #777); }
.press-row > span { display: block; min-width: 0; white-space: nowrap; font-size: 11px; color: inherit; }
.press-row > span:first-child { flex: 0 0 27px; }
.press-row > span:nth-child(2) { flex: 0 0 68px; }
.press-row > span:nth-child(3) { flex: 1 1 auto; margin-right: 4px; overflow: hidden; text-overflow: ellipsis; }
.press-row > span:last-child { display: flex; flex: 0 0 118px; justify-content: flex-end; align-items: center; }
.press-row button, .press-panel-actions button { padding: 2px 6px; margin: 0 4px 3px 0; min-height: 21px; }
.press-row button { flex: 0 0 50px; width: 50px; min-width: 0; }
.press-row button + button { flex-basis: 56px; width: 56px; }
.press-columns > span:last-child { justify-content: flex-start; }
.press-columns { font-weight: 700; }
.press-panel-actions { display: flex; flex-wrap: wrap; margin-top: 8px; }
#status { color: inherit; margin: 6px 0 0; }
</style></head><body>
<div class="press-brand"><img src="press-logo.svg" alt="이브레 디지털조판시스템"></div>
<section id="login">
<label for="email">이메일</label><input id="email" type="text">
<label for="password">비밀번호</label><input id="password" type="password" required>
<button id="login-submit" type="button">로그인</button>
</section>
<section id="workspace" hidden>
<label class="press-label" for="issue">발행 계획</label><select id="issue"></select>
<h3 class="press-label">편집할 면</h3>
<div class="press-scroll"><div class="press-table" role="table" aria-label="편집할 면">
<div class="press-row press-columns" role="row"><span role="columnheader">면</span><span role="columnheader">최근 편집</span><span role="columnheader">상태</span><span role="columnheader">작업</span></div>
<div id="page-rows" role="rowgroup"></div>
</div></div>
<div class="press-panel-actions">
<button id="reload" type="button">새로고침</button>
<button id="logout" type="button">로그아웃</button>
</div>
</section>
<p id="status" role="status"></p>
<script src="main.js"></script></body></html>
